# NWChemEx is a pure-Python "conglomerate" package: it has no C++ of its own and
# simply pulls together the ecosystem plugins. Like FriendZone it uses a plain
# setuptools build (no CMake); the compiled ecosystem arrives via its wheel
# dependencies.

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nwchemex"
description = "A top-level, user-focused, conglomerate repo for the NWChemEx project."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "jwaldrop107", email = "jwaldrop@ameslab.gov" },
    { name = "zachcran",    email = "zachcran@iastate.edu" },
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]
dynamic = ["version"]
dependencies = [
    "nwchemex-simde",
    "nwchemex-integrals",
    "nwchemex-scf",
    "nwchemex-nux",
    "nwchemex-chemcache",
    "nwchemex-friendzone",
]

[project.optional-dependencies]
test = ["pytest"]
dev  = ["nwchemex[test]", "tox", "pre-commit"]

# Python source lives under python/ (analogous to cxx/ in the C++ repos).
[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
log_cli_level = "INFO"
filterwarnings = ["error", "ignore::pytest.PytestCacheWarning"]
testpaths = ["tests"]
