name: Pull Request Workflow

on:
  pull_request:
    branches:
      - build_overhaul

jobs:
  check_formatting:
    uses: ryanmrichard/.github/.github/workflows/check_formatting.yaml@master

  test_nwx_docs:
    uses: ryanmrichard/.github/.github/workflows/test_nwx_docs.yaml@master
    with:
      doc_target: "Sphinx"

  # Shared with nightly.yaml -- see that file's comments for why this repo
  # doesn't use the shared test_nwx_cmake_build/test_nwx_pip_build workflows.
  test_python_build:
    uses: ./.github/workflows/test_python_build.yaml
