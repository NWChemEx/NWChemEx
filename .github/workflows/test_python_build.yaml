name: Test Python Build
# Builds NWChemEx's distribution and runs its test suite. pull_request.yaml
# and nightly.yaml both need exactly these jobs, so they live here instead of
# being duplicated in each.
#
# This is a repo-local reusable workflow rather than test_nwx_pip_build
# because test_python below needs a real NWChem install (needs_nwchem) and a
# PATH sanity check that the shared pip_build action has no input for -- see
# test_cmake_build below for coverage of the CMake path (get_dependencies
# (integrals chemcache nux scf), the LANGUAGES NONE superbuild) on its own,
# via the shared cmake_build action instead. It isn't a composite action
# because the duplication includes the job's matrix and runs-on, which an
# action can't own.
#
# Callers reference it as `uses: ./.github/workflows/test_python_build.yaml`,
# which resolves at the caller's own commit -- so a PR that edits this file
# tests the edited version.

on:
  workflow_call:

jobs:
  # Exercises CMakeLists.txt's superbuild (get_dependencies(integrals
  # chemcache nux scf), which transitively pulls in the rest of the
  # ecosystem) -- the same CMake path every other ecosystem repo's
  # INTEGRATION_TESTING build depends on via get_dependencies(nwchemex), so
  # it needs its own coverage rather than riding along on theirs. No unit
  # tests or Python bindings are wired up in this CMakeLists (it only
  # defines the "nwchemex" aggregator INTERFACE target), hence both test
  # inputs are off -- turning either on would trip the shared action's
  # zero-tests guard.
  test_cmake_build:
    uses: NWChemEx/.github/.github/workflows/test_nwx_cmake_build.yaml@master
    with:
      run_cmake_tests: "false"
      run_python_tests: "false"

  # Dry-run of the actual sdist/wheel build (not just an editable install via
  # test_python below) -- catches e.g. files missing from the sdist manifest
  # that an editable install wouldn't. Deliberately doesn't set cibw_build:
  # this is a smoke build (does it build & install cleanly, is the metadata
  # right), not a check that the wheel is manylinux/macOS-portable -- that's
  # what merge.yaml's real, matrixed build_pypi_dist is for.
  #
  # build_pypi_dist's needs_mpi/needs_boost/needs_blas/needs_eigen/
  # needs_openmp inputs only take effect on the cibuildwheel path (gated
  # behind `if: inputs.cibw_build != ''` in that action) -- unset here on
  # purpose, so they'd be silently ignored. Since the CMake build now
  # actually compiles the ecosystem (get_dependencies(integrals chemcache
  # nux scf), which transitively needs Eigen3 for libint2's C++ API, plus
  # Boost/BLAS/MPI further down the graph), setup_nwx_dev_env has to provide
  # those on this bare runner instead, the same way test_python below does.
  test_pypi_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup NWX Dev Environment
        uses: NWChemEx/.github/.github/actions/setup_nwx_dev_env@master
        with:
          compiler: gcc-14
      - name: Build PyPI Distribution
        uses: NWChemEx/.github/.github/actions/build_pypi_dist@master

  # python/nwchemex itself is pure Python, but pip install now drives a real
  # CMake build (get_dependencies(integrals chemcache nux scf) -- see
  # pyproject.toml's top comment), so this needs a real compiler too, hence
  # setup_nwx_dev_env's compiler input below. It's still just an OS-only
  # matrix (not the full dev_matrix compiler axis) to keep this job's
  # existing needs_nwchem customization simple; the shared cmake_build
  # action's dev_matrix already covers both compilers for the CMake path via
  # test_cmake_build above.

  test_python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to 3.12, not "3.x" (whatever's newest, e.g. 3.14 today):
      # the ecosystem's own dependencies are only published as prebuilt
      # wheels for cp312 (platform_matrix.yaml's release_matrix). Under a
      # newer ambient Python, pip falls back to building those from source,
      # which succeeds (setup_nwx_dev_env provides MPI/Boost/etc.) but
      # produces a binary missing the rpath-bundled shared libs that
      # cibuildwheel+delocate/auditwheel normally provide for the real
      # published wheel, so it fails to import at runtime.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup NWX Dev Environment
        uses: NWChemEx/.github/.github/actions/setup_nwx_dev_env@master
        with:
          compiler: gcc-14
          needs_nwchem: "true"
      - name: Sanity-check NWChem Is On PATH
        shell: bash
        run: which nwchem
      - name: Install
        shell: bash
        run: |
          pip install -e ".[dev]" \
            --config-settings=cmake.define.CMAKE_C_COMPILER="${CC}" \
            --config-settings=cmake.define.CMAKE_CXX_COMPILER="${CXX}"
      - name: Test Python
        shell: bash
        run: |
          set +e
          pytest -v
          pytest_exit=$?
          set -e

          if [ "$pytest_exit" -eq 5 ]; then
              echo "::error::zero pytest tests were found."
              exit 1
          fi
          exit "$pytest_exit"
