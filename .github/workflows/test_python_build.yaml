name: Test Python Build
# Builds NWChemEx's distribution and runs its test suite. pull_request.yaml
# and nightly.yaml both need exactly these jobs, so they live here instead of
# being duplicated in each.
#
# This is a repo-local reusable workflow rather than one of the shared
# NWChemEx/.github ones because NWChemEx is pure Python (no CMakeLists.txt):
# test_nwx_cmake_build/test_nwx_pip_build both drive a scikit-build-core CMake
# build and don't apply. It isn't a composite action because the duplication
# includes the job's matrix and runs-on, which an action can't own.
#
# Callers reference it as `uses: ./.github/workflows/test_python_build.yaml`,
# which resolves at the caller's own commit -- so a PR that edits this file
# tests the edited version.

on:
  workflow_call:

jobs:
  # Dry-run of the actual sdist/wheel build (not just an editable install via
  # test_python below) -- catches e.g. files missing from the sdist manifest
  # that an editable install wouldn't. Matches FriendZone's own
  # test_python_build.yaml.
  test_pypi_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build PyPI Distribution
        uses: NWChemEx/.github/.github/actions/build_pypi_dist@master

  # NWChemEx is pure Python (no CMakeLists.txt), so there's nothing to
  # compile and the compiler axis of the shared dev matrix is meaningless
  # here -- just a lean OS-only matrix. setup_nwx_dev_env still runs (via its
  # unconditional MPI/Boost install) because the ecosystem's prebuilt wheels
  # dynamically link against libmpi at import time, and bare GitHub runners
  # have no MPI by default.
  #
  # continue-on-error on macos-latest: nwchemex-scf has a known, tracked,
  # macOS-only segfault (see scf-macos-pybind11-segfault.md) and only
  # publishes a Linux wheel for now, so this leg still runs and reports its
  # real result -- visible signal for the ongoing investigation -- without
  # blocking this workflow or PR merge readiness. Drop once fixed.
  test_python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to 3.12, not "3.x" (whatever's newest, e.g. 3.14 today):
      # the ecosystem's own dependencies are only published as prebuilt
      # wheels for cp312 (platform_matrix.yaml's release_matrix). Under a
      # newer ambient Python, pip falls back to building those from source,
      # which succeeds (setup_nwx_dev_env provides MPI/Boost/etc.) but
      # produces a binary missing the rpath-bundled shared libs that
      # cibuildwheel+delocate/auditwheel normally provide for the real
      # published wheel, so it fails to import at runtime.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup NWX Dev Environment
        uses: NWChemEx/.github/.github/actions/setup_nwx_dev_env@master
        with:
          compiler: gcc-14
          needs_nwchem: "true"
      - name: Sanity-check NWChem Is On PATH
        shell: bash
        run: which nwchem
      - name: Install
        shell: bash
        run: |
          pip install -e ".[dev]"
      - name: Test Python
        shell: bash
        run: |
          set +e
          pytest -v
          pytest_exit=$?
          set -e

          if [ "$pytest_exit" -eq 5 ]; then
              echo "::error::zero pytest tests were found."
              exit 1
          fi
          exit "$pytest_exit"
